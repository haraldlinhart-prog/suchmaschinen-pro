name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The tests only import lib/content/*.ts (no dependencies), Node 24 runs TypeScript
      # directly by stripping the types, so no npm install is needed.
      - run: npm test
